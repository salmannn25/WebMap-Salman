<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- CSS bawaan QGIS2Web -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <title>Jejak yang Berkesan di Kota Yogyakarta</title>

    <style>
        :root {
            --primary: #287C78;
            --primary-dark: #174C4F;
            --light-teal: #D9F0E9;
            --terracotta: #E07A5F;
            --cream: #F4EBDD;
            --white: #FFFFFF;
            --text: #244442;
            --border: #D8E5DF;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--cream);
        }

        /* HEADER PETA */
        .map-header {
            position: relative;
            z-index: 1000;
            flex: 0 0 auto;
            width: 100%;
            min-height: 132px;
            padding: 20px 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            overflow: hidden;
            color: var(--white);
            background: linear-gradient(115deg, var(--primary-dark), var(--primary));
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .header-label {
            display: inline-block;
            margin-bottom: 7px;
            padding: 5px 11px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            color: var(--light-teal);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .map-header h1 {
            margin: 0;
            color: var(--white);
            font-size: 29px;
            line-height: 1.15;
            font-weight: 750;
        }

        .map-header h2 {
            margin: 2px 0 5px;
            color: var(--cream);
            font-size: 19px;
            line-height: 1.2;
            font-weight: 500;
        }

        .map-header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            line-height: 1.5;
        }

        .header-decoration {
            position: absolute;
            right: 38px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.10);
            font-size: clamp(28px, 5vw, 64px);
            font-weight: 800;
            letter-spacing: 5px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* AREA PETA */
        #map {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            background: #EAF1ED;
        }

        /* TAMPILAN KONTROL OPENLAYERS */
        .ol-control > * {
            background-color: #F8F8F8 !important;
            color: #244442 !important;
            border-radius: 4px;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #244442 !important;
        }

        .search-layer-input-search {
            background-color: #FFFFFF !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(217, 240, 233, 0.95) !important;
        }

        .ol-control {
            background-color: rgba(255, 255, 255, 0.72) !important;
            padding: 3px !important;
            border-radius: 6px !important;
        }

        .ol-zoom button,
        .ol-rotate button,
        .ol-attribution button {
            color: var(--primary-dark) !important;
        }

        .ol-scale-line {
            background: rgba(23, 76, 79, 0.82) !important;
            border-radius: 4px;
        }

        .ol-scale-line-inner {
            border-color: #FFFFFF !important;
            color: #FFFFFF !important;
        }

        /* POPUP */
        .ol-popup {
            border-top: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
        }

        .ol-popup-closer {
            color: var(--primary-dark);
        }

        #popup-content {
            color: var(--text);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .map-header {
                min-height: 116px;
                padding: 15px 18px;
            }

            .map-header h1 {
                font-size: 22px;
            }

            .map-header h2 {
                font-size: 16px;
            }

            .map-header p {
                max-width: 85%;
                font-size: 10px;
            }

            .header-label {
                font-size: 8px;
                letter-spacing: 1.4px;
            }

            .header-decoration {
                right: 12px;
                font-size: 25px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER PETA -->
    <header class="map-header">
        <div class="header-content">
            <div class="header-label">PETA INTERAKTIF YOGYAKARTA</div>
            <h1>Jejak yang Berkesan</h1>
            <h2>di Kota Yogyakarta</h2>
            <p>Menelusuri tempat, cerita, dan kenangan di sudut Kota Yogyakarta.</p>
        </div>
        <div class="header-decoration">YOGYAKARTA</div>
    </header>

    <!-- PETA QGIS2WEB -->
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- SCRIPT BAWAAN QGIS2WEB: jangan dihapus atau diubah urutannya -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <script src="layers/BahanPraktikumM1220261118ADMINISTRASIDESA_AR_25K_1.js"></script>
    <script src="layers/BahanPraktikumM1220261118JALAN_LN_25K_2.js"></script>
    <script src="layers/TempatBerkesan_3.js"></script>

    <script src="styles/BahanPraktikumM1220261118ADMINISTRASIDESA_AR_25K_1_style.js"></script>
    <script src="styles/BahanPraktikumM1220261118JALAN_LN_25K_2_style.js"></script>
    <script src="styles/TempatBerkesan_3_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>
</body>
</html>
